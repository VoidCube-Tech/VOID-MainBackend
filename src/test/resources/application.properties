spring.profiles.active=test
spring.application.name=backend.main-test

# DataSource H2 em memória com modo PostgreSQL
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate cria automaticamente schemas e tabelas para H2
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Desabilita Flyway, Redis e RabbitMQ em testes
spring.flyway.enabled=false
spring.autoconfigure.exclude=\
  org.springframework.boot.flyway.autoconfigure.FlywayAutoConfiguration,\
  org.springframework.boot.data.redis.autoconfigure.DataRedisAutoConfiguration,\
  org.springframework.boot.amqp.autoconfigure.RabbitAutoConfiguration

# JWT — Configurações para ambiente de testes
security.jwt.issuer=http://localhost:8080
security.jwt.access-token-expiry-seconds=900